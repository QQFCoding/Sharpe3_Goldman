# Copy into Community Cloud Advanced settings -> Secrets. Never commit actual secrets.
# Standalone mode runs a real, isolated demo gateway with the pinned detector.
AICL_CLOUD_STANDALONE = "true"
# Optional, for operator approval/audit/reload in this isolated demo:
# AICL_CLOUD_OPERATOR_TOKEN = "replace-with-your-own-random-value-at-least-24-characters"
# Optional: use an existing production gateway instead of standalone mode.
# AICL_CLOUD_STANDALONE = "false"
# AICL_GATEWAY_URL = "https://your-gateway.example.com"
# Operator credentials are entered per session. Do not put a shared production admin token here.
