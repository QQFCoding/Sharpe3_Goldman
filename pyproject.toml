[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-control-layer"
version = "0.1.0"
description = "Local-first policy enforcement gateway for AI, tools, and memory"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "PyYAML>=6,<7",
  "jsonschema>=4.23,<5", "regex>=2024.11", "redis>=5.2,<7",
  "psycopg[binary,pool]>=3.2,<4", "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "fakeredis[lua]>=2.28,<3"]
semantic = ["transformers>=4.48,<5", "torch>=2.6,<3", "sentencepiece>=0.2,<1"]

[tool.setuptools.packages.find]
include = ["app*", "demo*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["performance: bounded local performance measurements"]

[tool.ruff]
line-length = 110
extend-exclude = [".tools", "models", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
